<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eee7" />
  <title>Birthday Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=LXGW+WenKai+TC&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <section class="hero section reveal">
      <div class="eyebrow skeleton skeleton-xs"></div>
      <div class="hero-title skeleton skeleton-title"></div>
      <div class="hero-title skeleton skeleton-title short"></div>
      <div class="rule"></div>
      <div class="hero-sub skeleton skeleton-sm"></div>
      <div class="hero-sub skeleton skeleton-sm short"></div>
      <button class="ghost-button" aria-label="繼續瀏覽"><span></span></button>
      <div class="scroll-mark" aria-hidden="true"></div>
    </section>

    <section class="editorial section reveal">
      <div class="section-index">01</div>
      <div class="editorial-grid">
        <div class="portrait-card photo-slot tall" role="img" aria-label="照片位置"></div>
        <div class="copy-block">
          <div class="serif-line skeleton skeleton-md"></div>
          <div class="serif-line skeleton skeleton-lg"></div>
          <div class="body-lines">
            <span></span><span></span><span class="short"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="film-strip section reveal">
      <div class="section-index">02</div>
      <div class="strip-track">
        <div class="photo-slot frame landscape"></div>
        <div class="photo-slot frame portrait"></div>
        <div class="photo-slot frame landscape"></div>
        <div class="photo-slot frame portrait"></div>
      </div>
      <div class="caption-line skeleton skeleton-sm"></div>
    </section>

    <section class="quote-section section reveal">
      <div class="section-index">03</div>
      <div class="quote-mark">“</div>
      <div class="quote-lines">
        <span></span><span></span><span class="short"></span>
      </div>
      <div class="handwriting-line skeleton skeleton-sm"></div>
    </section>

    <section class="timeline section reveal">
      <div class="section-index">04</div>
      <div class="timeline-line"></div>
      <article class="moment left">
        <div class="moment-dot"></div>
        <div class="photo-slot square"></div>
        <div class="moment-copy"><span></span><span class="short"></span></div>
      </article>
      <article class="moment right">
        <div class="moment-dot"></div>
        <div class="photo-slot square"></div>
        <div class="moment-copy"><span></span><span class="short"></span></div>
      </article>
      <article class="moment left">
        <div class="moment-dot"></div>
        <div class="photo-slot square"></div>
        <div class="moment-copy"><span></span><span class="short"></span></div>
      </article>
    </section>

    <section class="cards section reveal">
      <div class="section-index">05</div>
      <div class="cards-intro">
        <div class="skeleton skeleton-md"></div>
        <div class="skeleton skeleton-sm short"></div>
      </div>
      <div class="card-grid">
        <div class="reason-card"><i>01</i><span></span><span></span></div>
        <div class="reason-card"><i>02</i><span></span><span></span></div>
        <div class="reason-card"><i>03</i><span></span><span></span></div>
        <div class="reason-card"><i>04</i><span></span><span></span></div>
        <div class="reason-card"><i>05</i><span></span><span></span></div>
        <div class="reason-card"><i>06</i><span></span><span></span></div>
      </div>
    </section>

    <section class="letter section reveal">
      <div class="letter-paper">
        <div class="letter-date skeleton skeleton-xs"></div>
        <div class="letter-heading skeleton skeleton-lg"></div>
        <div class="letter-body">
          <span></span><span></span><span></span><span></span><span class="short"></span>
          <span></span><span></span><span class="medium"></span>
        </div>
        <div class="signature skeleton skeleton-sm"></div>
      </div>
    </section>

    <section class="locked section reveal">
      <div class="section-index">23</div>
      <div class="lock-orbit">
        <div class="lock-icon"></div>
      </div>
      <div class="locked-line skeleton skeleton-md"></div>
      <div class="locked-line skeleton skeleton-sm short"></div>
    </section>

    <footer class="footer reveal">
      <div class="footer-rule"></div>
      <div class="footer-mark"></div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
